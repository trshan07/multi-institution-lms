name: lms-development
services:
  postgres:
    # Opt in to avoid colliding with an existing local PostgreSQL on port 5432.
    profiles: ["database"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lms_dev
      POSTGRES_PASSWORD: lms_local_only
      POSTGRES_DB: lms
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_dev -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lms_local
      MINIO_ROOT_PASSWORD: lms_local_secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage-data:/data"]
volumes:
  postgres-data:
  redis-data:
  storage-data:
